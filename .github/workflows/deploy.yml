name: deploy

on:
  push:
    branches: [main, feat/saas]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/saas'
    runs-on: [self-hosted, freshswitch-backend]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: /srv/freshswitch/backend
    steps:
      - name: checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --force --detach "$GITHUB_SHA"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GH_TOKEN

      - name: build and deploy main
        if: github.ref == 'refs/heads/main'
        run: docker compose up -d --build --remove-orphans

      - name: health check main
        if: github.ref == 'refs/heads/main'
        run: |
          port=$(sed -n 's/^HOST_PORT=//p' .env)
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port:-18103}/api/health"; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail 100 api
          exit 1

      - name: verify SaaS database settings before redeploy
        if: github.ref == 'refs/heads/feat/saas'
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          values = {}
          for line in Path(".env").read_text().splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  value = value[1:-1]
              values[key.strip()] = value

          def container_env(name):
              raw = subprocess.check_output(
                  ["docker", "inspect", "--format", "{{json .Config.Env}}", name],
                  text=True,
              )
              return dict(item.split("=", 1) for item in json.loads(raw) if "=" in item)

          try:
              current_db = container_env("freshswitch-saas-db-1")
              current_api = container_env("freshswitch-saas-api-1")
          except subprocess.CalledProcessError as exc:
              raise SystemExit(
                  "Refusing SaaS redeploy: existing SaaS API/DB container was not found."
              ) from exc

          mismatches = []
          for key in ("POSTGRES_USER", "POSTGRES_PASSWORD", "POSTGRES_DB"):
              candidate = values.get(key, "freshswitch")
              if current_db.get(key) != candidate or current_api.get(key, candidate) != candidate:
                  mismatches.append(key)
          candidate_url = values.get("DATABASE_URL", "")
          if current_api.get("DATABASE_URL", "") != candidate_url:
              mismatches.append("DATABASE_URL")
          if mismatches:
              raise SystemExit(
                  "Refusing SaaS redeploy: existing database settings differ from .env for "
                  + ", ".join(mismatches)
                  + ". No credential values were printed."
              )
          print("saas_database_settings_match=true")
          PY

      - name: build and deploy SaaS
        if: github.ref == 'refs/heads/feat/saas'
        env:
          API_TAG: ${{ github.sha }}
        run: docker compose --env-file .env -f docker-compose.saas.yml up -d --build --remove-orphans

      - name: health check SaaS
        if: github.ref == 'refs/heads/feat/saas'
        run: |
          set -euo pipefail
          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18106/test/api/health -o /tmp/freshswitch-saas-health.json \
              && python3 -c 'import json; d=json.load(open("/tmp/freshswitch-saas-health.json")); assert d.get("status") == "ok" and d.get("db") == "ok"'; then
              cat /tmp/freshswitch-saas-health.json
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose --env-file .env -f docker-compose.saas.yml logs --tail 100 api
            exit 1
          fi

      - name: verify SaaS delay ML model
        if: github.ref == 'refs/heads/feat/saas'
        run: |
          docker compose --env-file .env -f docker-compose.saas.yml exec -T api \
            python -c 'from freshswitch_backend.config import Settings; from freshswitch_backend.forecast.ml.adapter import initialize_delay_model; s=Settings(); assert s.feature_p1_delay_ml, "FEATURE_P1_DELAY_ML is disabled"; assert initialize_delay_model(s), "delay ML model failed to load"; print("delay_ml_model_loaded=true")'

      - name: verify SaaS delay response schema
        if: github.ref == 'refs/heads/feat/saas'
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen(
              "http://127.0.0.1:18106/test/api/openapi.json", timeout=10
          ) as response:
              spec = json.load(response)
          fields = spec["components"]["schemas"]["VoyageForecast"]["properties"]
          required = {"delay_p50_h", "delay_p90_h", "departure_p50", "departure_p90", "strong_wind_rule", "mode", "source", "assumptions"}
          missing = sorted(required - fields.keys())
          if missing:
              raise SystemExit(f"SaaS delay response schema missing fields: {missing}")
          print("delay_response_schema=ok")
          PY

      - name: prune unused images
        if: always()
        run: docker image prune -f
