name: freshswitch

services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-freshswitch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freshswitch}
      POSTGRES_DB: ${POSTGRES_DB:-freshswitch}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-fs_demo_session}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${HOST_PORT:-18103}:8000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freshswitch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freshswitch}
      POSTGRES_DB: ${POSTGRES_DB:-freshswitch}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    shm_size: 128m
    mem_limit: 512m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
