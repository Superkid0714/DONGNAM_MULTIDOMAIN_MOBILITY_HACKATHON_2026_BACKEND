[project]
name = "freshswitch-backend"
version = "0.1.0"
description = "FreshSwitch 공동적재·재최적화 백엔드"
authors = [
    { name = "kirito2056", email = "gwonhajin2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "catboost>=1.2.10",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "openai>=3.41.0",
    "ortools>=9.15.6755",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
